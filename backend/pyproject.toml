[project]
name = "prediction-market-arb-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.0",
  "pydantic>=2.7.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.30",
  "structlog>=24.1.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest-asyncio>=0.23.0",
  "pytest>=8.2.0",
  "ruff>=0.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
